<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会员后台管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{padding:20px;background:#f4f4f4}
.container{max-width:600px;margin:0 auto;background:#fff;padding:20px;border-radius:10px}
h2{text-align:center}
.customer-item{border:1px solid #eee;padding:12px;margin:8px 0;border-radius:8px}
button{padding:8px;margin:4px;border:none;border-radius:6px}
.btn-del{background:#dc3545;color:white}
.btn-save{background:#198754;color:white}
</style>
</head>
<body>
<div class="container">
  <h2>会员后台管理</h2>
  <button onclick="loadAllCustomer()">刷新会员列表</button>
  <button onclick="toggleDelView()">显示/隐藏已注销顾客</button>
  <div id="listWrap"></div>
</div>

<script>
// ==========【这里！你修改下面两行】==========
const SUPABASE_URL = "填入你的数据库地址";
const SUPABASE_KEY = "填入你的Publishable密钥";
// =========================================
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
let showDeleted = false;

async function loadAllCustomer(){
  let query = supabase.from('customer_list').select('*');
  if(!showDeleted) query = query.eq('is_deleted',false);
  const {data:customerList,error} = await query;
  if(error){
    alert("读取会员失败："+error.message);
    return;
  }
  let html = "";
  customerList.forEach(c=>{
    html += `
    <div class="customer-item">
      <p>姓名：${c.name}｜手机号：${c.phone}</p>
      <p>生日：${c.birthday}</p>
      <p>优惠券：<input id="cp_${c.id}" value="${c.coupon}" style="width:80px"></p>
      <p>会员分数：<input id="pt_${c.id}" value="${c.points}" style="width:80px"></p>
      <button class="btn-save" onclick="saveEdit('${c.id}')">保存修改</button>
      <button class="btn-del" onclick="delCustomer('${c.id}')">注销顾客</button>
    </div>`
  })
  document.getElementById("listWrap").innerHTML = html;
}
function toggleDelView(){
  showDeleted = !showDeleted;
  loadAllCustomer();
}
async function saveEdit(cid){
  const newCoupon = document.getElementById("cp_"+cid).value.trim();
  const newPoint = parseInt(document.getElementById("pt_"+cid).value);
  await supabase.from('customer_list').update({coupon:newCoupon,points:newPoint}).eq('id',cid);
  alert("✅修改保存成功");
  loadAllCustomer();
}
async function delCustomer(cid){
  if(!confirm("确认注销该顾客账号？注销之后顾客无法登录，可在隐藏列表查看历史资料")) return;
  await supabase.from('customer_list').update({is_deleted:true}).eq('id',cid);
  alert("注销完成");
  loadAllCustomer();
}
window.onload = loadAllCustomer;
</script>
</body>
</html>
