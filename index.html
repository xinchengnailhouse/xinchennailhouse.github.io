<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会员注册登录</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{padding:24px;margin:0;background:#f7f7f7}
.container{max-width:420px;margin:0 auto;background:#fff;padding:24px;border-radius:12px}
h2{text-align:center}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}
button{width:100%;padding:12px;margin:8px 0;background:#222;color:#fff;border:none;border-radius:8px;font-size:16px}
</style>
</head>
<body>
<div class="container">
  <div id="loginBox">
    <h2>会员登录</h2>
    <input type="text" id="loginPhone" placeholder="请输入手机号">
    <input type="password" id="loginPwd" placeholder="请输入密码">
    <button onclick="userLogin()">登录</button>
    <p style="text-align:center">还没有账号？<a href="#" onclick="showRegister()">去注册</a></p>
  </div>

  <div id="regBox" style="display:none;">
    <h2>会员注册</h2>
    <input type="text" id="regName" placeholder="姓名">
    <input type="text" id="regPhone" placeholder="手机号（仅限10位数字）">
    <input type="date" id="regBirthday" placeholder="生日">
    <input type="password" id="regPwd" placeholder="设置登录密码">
    <button onclick="userRegister()">注册</button>
    <p style="text-align:center">已有账号？<a href="#" onclick="showLogin()">返回登录</a></p>
  </div>

  <div id="userInfo" style="display:none;">
    <h2>会员资料</h2>
    <p>姓名：<span id="uName"></span></p>
    <p>手机号：<span id="uPhone"></span></p>
    <p>生日：<span id="uBirth"></span></p>
    <p>优惠券：<span id="uCoupon"></span></p>
    <p>会员分数：<span id="uPoint"></span></p>
    <button onclick="logout()">退出登录</button>
  </div>
</div>

<script>
// ==========【这里！你修改下面两行】==========
const SUPABASE_URL = "填入你的数据库地址";
const SUPABASE_KEY = "填入你的Publishable密钥";
// =========================================
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

// 切换页面
function showRegister(){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('regBox').style.display='block';
}
function showLogin(){
  document.getElementById('regBox').style.display='none';
  document.getElementById('loginBox').style.display='block';
}

// 注册
async function userRegister(){
  const name = document.getElementById('regName').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const birthday = document.getElementById('regBirthday').value.trim();
  const pwd = document.getElementById('regPwd').value.trim();

  // 校验手机号10位
  if(!/^\d{10}$/.test(phone)){
    alert("手机号必须为10位数字，注册失败！");
    return;
  }
  if(!name || !pwd){
    alert("姓名和密码不能为空");
    return;
  }
  // 查询手机号是否已经注册
  const {data:existUser} = await supabase.from('customer_list').select('*').eq('phone',phone).single();
  if(existUser){
    alert("该手机号已经注册会员！");
    return;
  }
  // 新增顾客，注册自动送Rm5优惠券
  const {error} = await supabase.from('customer_list').insert([{
    name:name,phone:phone,birthday:birthday,password:pwd,coupon:"Rm5",points:0,is_deleted:false
  }])
  if(error){
    alert("注册失败："+error.message);
    return;
  }
  alert("✅注册成功！自动获得Rm5优惠券");
  showLogin();
}

// 登录
async function userLogin(){
  const phone = document.getElementById('loginPhone').value.trim();
  const pwd = document.getElementById('loginPwd').value.trim();
  const {data:user,error} = await supabase.from('customer_list').select('*').eq('phone',phone).single();
  if(error || !user){
    alert("手机号不存在");
    return;
  }
  if(user.is_deleted === true){
    alert("账号已被注销，请重新注册");
    return;
  }
  if(user.password !== pwd){
    alert("密码错误");
    return;
  }
  // 登录成功展示资料
  document.getElementById('loginBox').style.display='none';
  document.getElementById('userInfo').style.display='block';
  document.getElementById('uName').innerText = user.name;
  document.getElementById('uPhone').innerText = user.phone;
  document.getElementById('uBirth').innerText = user.birthday;
  document.getElementById('uCoupon').innerText = user.coupon;
  document.getElementById('uPoint').innerText = user.points;
}
function logout(){
  document.getElementById('userInfo').style.display='none';
  document.getElementById('loginBox').style.display='block';
}
</script>
</body>
</html>
