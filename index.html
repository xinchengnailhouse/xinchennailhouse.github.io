<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会员系统 - 注册</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body {
            background-color: #f4ece0;
            padding: 30px 16px;
        }
        .container {
            background-color: #fff8e3;
            border-radius: 24px;
            padding: 40px 24px;
            max-width: 480px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #6b442f;
            font-size: 48px;
        }
        .sub-title {
            text-align: center;
            color: #88644e;
            font-size: 32px;
            margin-bottom: 40px;
        }
        .form-item {
            margin-bottom: 24px;
        }
        label {
            display: block;
            color: #6b442f;
            font-size: 22px;
            margin-bottom: 10px;
        }
        input {
            width: 100%;
            font-size: 28px;
            padding: 20px 16px;
            border: 2px solid #d9c8b4;
            border-radius: 16px;
            background: #fff;
        }
        button {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 16px;
            background-color: #966b52;
            color: white;
            font-size: 26px;
            margin: 30px 0;
            cursor: pointer;
        }
        .back-text {
            text-align: center;
            font-size: 24px;
            color:#77543f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>注册</h1>
        <div class="sub-title">REGISTER</div>
        <div class="form-item">
            <label>姓名 / Name</label>
            <input type="text" id="nameInput" placeholder="请输入姓名">
        </div>
        <div class="form-item">
            <label>手机号 / Phone Number</label>
            <input type="tel" id="phoneInput" placeholder="请输入10位手机号">
        </div>
        <div class="form-item">
            <label>生日 / Birthday</label>
            <input type="text" id="birthInput" placeholder="例如：2026/9/25">
        </div>
        <button id="registerBtn">完成注册<br>REGISTER</button>
        <div class="back-text">← 返回首页<br>BACK TO HOME</div>
    </div>

    <script>
        // ========== 这里改成你自己的Supabase信息 ==========
        const SUPABASE_URL = "https://lzszgnvjqgttummlhqqvh.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_jzwFUQ1rtxSgR5XA91qPOQ_cIVYSOAr";
        // ==================================================
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const registerBtn = document.getElementById('registerBtn');

        registerBtn.addEventListener('click', async function(){
            let name = document.getElementById('nameInput').value.trim();
            let phone = document.getElementById('phoneInput').value.trim();
            let birth = document.getElementById('birthInput').value.trim();

            // 校验
            if(!name){
                alert("请填写姓名");
                return;
            }
            if(phone.length !== 10){
                alert("手机号必须是10位数！");
                return;
            }
            if(!birth){
                alert("请填写生日");
                return;
            }

            try {
                // 写入数据库
                const {error} = await supabase.from('customers').insert([{
                    name: name,
                    phone: phone,
                    birth: birth
                }])
                if(error){
                    throw error;
                }
                alert("✅ 注册成功！自动赠送Rm5优惠券");
                // 注册成功跳转，可以改成你的登录页/首页链接
                // window.location.href = "你的首页链接";
            } catch (err) {
                alert("❌注册失败：" + err.message);
            }
        })
    </script>
</body>
</html>
